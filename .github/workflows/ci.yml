name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A workflow that fails to PARSE reports nothing at all: no jobs run, no
  # checks appear, and a pull request looks unexercised rather than broken.
  # Every other lane in this file is downstream of the file itself being
  # readable, so none of them can report that it is not.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  core:
    name: core (OS-independent, 100% coverage, CGO=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test (OS-independent core, with coverage)
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1
      - name: Race (OS-independent core)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  windows:
    name: windows (live glue build + core tests, CGO=0)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Build (Win32 glue)
        run: go build ./...
        env:
          CGO_ENABLED: '0'
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: '0'
      - name: Test (OS-independent core on Windows)
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: '0'

  # Windows ARM64 on a real arm64 runner: the Go runtime's callback entry does
  # not preserve D8-D15 (golang/go#82503), which wincb repairs. Its control test
  # proves the probe can see a clobber, its thunk test proves wincb removes it.
  # A run that did not PASS the named tests fails the step.
  windows-arm64:
    name: windows arm64 (callback registers D8-D15)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Callback thunk keeps D8-D15
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go vet ./...
          go test -count=1 -v ./... *> arm64.txt
          $rc = $LASTEXITCODE
          Get-Content arm64.txt
          if ($rc -ne 0) { exit $rc }
          foreach ($t in 'TestControlCalleeClobbersCallerDoubles', 'TestThunkPreservesCallerDoubles', 'TestEverySlotReachesItsOwnTarget') {
            if (-not (Select-String -Path arm64.txt -Pattern "^--- PASS: $t ")) {
              Write-Error "$t did not run to a PASS"
              exit 1
            }
          }

  cross:
    name: cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Win32 glue builds on both 64-bit Windows targets.
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          # The OS-independent core builds on all six of Go's 64-bit targets.
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
